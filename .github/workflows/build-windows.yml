name: Compilar para Windows

# Gera uma pasta com o QEstoqueLoja.exe (Qt 6 + MSVC) para testar as mudanças.
# Rode manualmente em Actions > "Compilar para Windows" > Run workflow.
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Baixar o código (com o submódulo cppbrasil)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Qt 6 (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtcharts qt5compat'
          cache: true

      # O CMake do projeto espera a pasta libs-externas/zint (não vem no repositório).
      - name: Baixar o Zint (código de barras)
        shell: bash
        run: git clone --depth 1 --branch 2.13.0 https://github.com/zint/zint.git libs-externas/zint

      # O submódulo traz só o código-fonte do QtRPT (relatórios); o CMake do projeto espera
      # o QtRPT.lib em QtRptProject/bin/release/lib. Compila com qmake (Qt) + MSVC.
      - name: Ambiente do compilador MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compilar o QtRPT
        shell: cmd
        working-directory: libs-externas/cppbrasil/third-party/QtRptProject-Source/QtRptProject/QtRPT
        run: |
          qmake QtRPT.pro CONFIG+=release
          nmake
          dir ..\bin\release
          dir ..\bin\release\lib

      # O projeto traz só o quazip1-qt6.lib (do computador do autor). A DLL dele foi feita com
      # OUTRA versão do Qt e não roda com esta. Compila o QuaZip aqui, com o mesmo Qt do programa,
      # e troca o .lib pelo novo (o CMake do projeto usa esse caminho).
      - name: Compilar o QuaZip
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          WS="$(cygpath -m "$GITHUB_WORKSPACE")"
          ZL="$WS/libs-externas/cppbrasil/third-party/windows/zlib-1.3"
          git clone --depth 1 --branch v1.4 https://github.com/stachenov/quazip.git quazip-src
          cmake -S quazip-src -B quazip-build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DQUAZIP_QT_MAJOR_VERSION=6 \
            -DQUAZIP_USE_QT_ZLIB=OFF -DZLIB_INCLUDE_DIR="$ZL/include" -DZLIB_LIBRARY="$ZL/lib/zdll.lib" \
            -DQUAZIP_BZIP2=OFF -DQUAZIP_ENABLE_TESTS=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build quazip-build --config Release --parallel
          find quazip-build -name "quazip1-qt6.*"
          cp "$(find quazip-build -name quazip1-qt6.lib | head -1)" libs-externas/quazip/quazip-lib/quazip1-qt6.lib
          cp "$(find quazip-build -name quazip1-qt6.dll | head -1)" "$WS/quazip1-qt6.dll"

      - name: Configurar (CMake)
        shell: bash
        run: |
          # o zint.h fica em libs-externas/zint/backend e o projeto o inclui como "zint.h"
          # "-I" (e não "/I"): o Git Bash trataria "/I..." como caminho e quebraria o comando
          export MSYS_NO_PATHCONV=1
          export CXXFLAGS="-I$(cygpath -m "$GITHUB_WORKSPACE")/libs-externas/zint/backend"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DZINT_USE_PNG=OFF -DZINT_USE_QT=OFF -DZINT_FRONTEND=OFF -DZINT_TEST=OFF

      - name: Compilar
        shell: bash
        run: cmake --build build --config Release --target QEstoqueLoja --parallel

      - name: Montar a pasta do programa
        shell: bash
        run: |
          mkdir -p dist
          EXE=$(find build -name QEstoqueLoja.exe | head -1)
          echo "Executável: $EXE"
          cp "$EXE" dist/
          # biblioteca do Zint (código de barras), se foi gerada como DLL
          find build -name "zint.dll" -exec cp {} dist/ \;
          # QuaZip compilado com o mesmo Qt do programa (a DLL antiga da instalação não serve)
          cp quazip1-qt6.dll dist/
          # biblioteca de relatórios (QtRPT), compilada acima
          find libs-externas -name "QtRPT.dll" -path "*bin/release*" -exec cp {} dist/ \;
          # QtRPT.dll vem antes: ela depende de Qt6Qml/Qt6Charts que o .exe sozinho não mostra ao windeployqt
          find libs-externas -name "QtRPT.dll" -path "*bin/release*" -exec cp {} dist/ \;
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations dist/QEstoqueLoja.exe dist/QtRPT.dll
          echo "--- Qt6*.dll no pacote:"; ls dist | grep -i "^Qt6"
          test -f dist/Qt6Qml.dll || { echo "ERRO: Qt6Qml.dll ausente no pacote"; exit 1; }
          test -f dist/quazip1-qt6.dll || { echo "ERRO: quazip1-qt6.dll ausente no pacote"; exit 1; }
          # driver do PostgreSQL do Qt (o programa usa PostgreSQL em rede); precisa ser o mesmo Qt do .exe
          mkdir -p dist/sqldrivers
          cp "$QT_ROOT_DIR/plugins/sqldrivers/qsqlpsql.dll" dist/sqldrivers/ || echo "qsqlpsql.dll nao encontrado no Qt"
          # identificação da versão (o script de atualização mostra este arquivo)
          echo "commit ${GITHUB_SHA} - branch ${GITHUB_REF_NAME} - compilado em $(date -u +%Y-%m-%d\ %H:%M) UTC" > dist/VERSAO.txt
          cp -r recursos dist/recursos
          cp -r reports dist/reports
          cat > dist/LEIA-ME.txt <<'EOF'
          Copie para esta pasta as DLLs da ACBrLib que você já usa na versão instalada
          (ACBrNFe64.dll, ACBrMail64.dll, ACBrConsultaCNPJ64.dll). Sem elas o programa fecha
          ao iniciar. Depois é só abrir o QEstoqueLoja.exe.
          EOF

      - name: Enviar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: QEstoqueLoja-windows
          path: dist
